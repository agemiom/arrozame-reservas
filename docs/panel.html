<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Panel · Arrózame</title>
  <meta name="theme-color" content="#1F1C19">
  <link rel="icon" href="img/icono.png">
  <link rel="apple-touch-icon" href="img/icono.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Open+Sans:wght@400;600;700&family=Libre+Baskerville:ital@0;1&display=swap">
  <link rel="stylesheet" href="css/arrozame.css">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <div id="banda-demo" class="banda-demo oculto">Modo demo · datos de ejemplo guardados en este navegador · <a href="#" id="reset-demo" style="color:#fff">reiniciar demo</a></div>

  <!-- LOGIN -->
  <section class="login oculto" id="login">
    <div class="login-foto">
      <img src="img/chef-paellera-900.webp" srcset="img/chef-paellera-900.webp 900w, img/chef-paellera-1600.webp 1600w" sizes="(max-width: 820px) 100vw, 55vw" alt="Chef de Arrózame sonriendo junto a una paellera en el fuego">
    </div>
    <form class="login-form" id="form-login">
      <img class="login-logo" src="img/logo_h_dark.png" alt="arrózame">
      <h1>Panel de reservas</h1>
      <p class="muted login-bajada">Agenda, clientes y ventas de Arrózame.</p>
      <label class="campo"><span>Email</span><input type="email" name="email" autocomplete="username" required></label>
      <label class="campo"><span>Contraseña</span><input type="password" name="password" autocomplete="current-password" required></label>
      <div class="aviso error oculto" id="login-error"></div>
      <button class="btn" style="width:100%">Entrar</button>
      <p class="small muted oculto" id="login-demo" style="text-align:center;margin-bottom:0">Modo demo: cualquier email y contraseña sirven.</p>
    </form>
  </section>

  <!-- APP -->
  <div class="app oculto" id="app">
    <aside class="lateral">
      <img src="img/logo_h_light.png" alt="arrózame">
      <nav id="menu">
        <button data-vista="agenda" class="activo"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h4"/></svg> Agenda</button>
        <button data-vista="calendario"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg> Calendario</button>
        <button data-vista="estadisticas"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7 16V11M12 16V6M17 16v-3"/></svg> Ventas</button>
        <button data-vista="clientes"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19.5c.6-3 2.8-4.8 5.5-4.8s4.9 1.8 5.5 4.8M15.5 5.6a3.2 3.2 0 0 1 0 6M17.5 14.9c1.6.6 2.7 2.2 3 4.6"/></svg> Clientes</button>
        <button data-vista="carta"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="13" rx="8.5" ry="4.5"/><path d="M3.5 13v1.2C3.5 16.7 7.3 19 12 19s8.5-2.3 8.5-4.8V13M20.5 12.5l2-1M3.5 12.5l-2-1M9 12.5h.01M13 11.5h.01M15 13.8h.01"/></svg> Carta</button>
        <button data-vista="ajustes"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5"/></svg> Ajustes</button>
      </nav>
      <div class="pie"><div id="usuario"></div><button id="salir">Cerrar sesión</button></div>
    </aside>
    <div class="sesion-movil"><span id="usuario-movil"></span><button id="salir-movil">Cerrar sesión</button></div>
    <main id="vista"></main>
  </div>

  <div class="tip" id="tip"></div>
  <script type="module" src="js/panel.js"></script>
</body>
</html>
