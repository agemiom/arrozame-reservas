<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Panel · Arrózame</title>
  <meta name="theme-color" content="#1F1C19">
  <link rel="icon" href="img/icono.png">
  <link rel="apple-touch-icon" href="img/icono.png">
  <link rel="stylesheet" href="css/arrozame.css">
  <style>
    body { background: #F5EFE3; }
    /* Login */
    .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--amarillo); }
    .login .tarjeta { width: 100%; max-width: 380px; }
    .login img { width: 200px; display: block; margin: 0 auto 18px; }

    /* Estructura */
    .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    .lateral { background: var(--tinta); color: #fff; padding: 20px 14px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
    .lateral img { width: 150px; margin: 4px 8px 24px; }
    .lateral nav button { display: flex; width: 100%; align-items: center; gap: 10px; border: 0; background: none; color: #d9d2c4; padding: 11px 12px; border-radius: 10px; cursor: pointer; font-weight: 600; text-align: left; }
    .lateral nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
    .lateral nav button.activo { background: var(--amarillo); color: var(--tinta); }
    .lateral .pie { margin-top: auto; font-size: 12px; color: #a39b8c; padding: 8px; }
    .lateral .pie button { background: none; border: 0; color: var(--amarillo); cursor: pointer; padding: 0; font-weight: 600; }
    main { padding: 26px clamp(16px, 3vw, 36px) 80px; min-width: 0; }
    .cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .cab h1 { font-size: 26px; margin: 0; }
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .lateral { position: fixed; bottom: 0; top: auto; left: 0; right: 0; height: auto; flex-direction: row; padding: 6px; z-index: 30; padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
      .lateral img, .lateral .pie { display: none; }
      .lateral nav { display: flex; width: 100%; justify-content: space-around; }
      .lateral nav button { flex-direction: column; gap: 2px; font-size: 10.5px; padding: 6px 4px; }
      .lateral nav button .ico { font-size: 18px; }
      main { padding-bottom: 100px; }
    }

    .sesion-movil { display: none; }
    @media (max-width: 820px) {
      .sesion-movil { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--tinta); color: #d9d2c4; font-size: 12.5px; padding: 8px 16px; }
      .sesion-movil button { background: none; border: 1px solid #5a5248; color: var(--amarillo); border-radius: 999px; padding: 4px 12px; font-weight: 600; cursor: pointer; }
      .app { grid-template-rows: auto 1fr; }
    }
    /* KPIs */
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .kpi { background: var(--papel); border-radius: var(--radio); padding: 16px 18px; box-shadow: var(--sombra); }
    .kpi .lbl { font-size: 12px; color: var(--gris); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .kpi .val { font-family: var(--f-titulo); font-weight: 800; font-size: 26px; margin-top: 4px; }
    .kpi .sub { font-size: 12px; color: var(--gris); }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 1000px) { .grid2 { grid-template-columns: 1fr; } }
    .tarjeta h2 { font-size: 17px; margin-bottom: 4px; }
    .tarjeta .bajada { font-size: 12.5px; color: var(--gris); margin: 0 0 14px; }

    /* Barras horizontales (ranking) */
    .barras { display: grid; gap: 9px; }
    .barra { display: grid; grid-template-columns: minmax(120px, 40%) 1fr auto; gap: 10px; align-items: center; font-size: 13.5px; position: relative; }
    .barra .nom { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .barra .pista { height: 14px; background: transparent; position: relative; }
    .barra .rel { height: 100%; background: var(--terracota); border-radius: 0 4px 4px 0; min-width: 2px; }
    .barra .num { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 64px; text-align: right; }
    .barra:hover .rel { background: var(--terracota-osc); }
    .barra .pos { color: var(--gris); font-size: 12px; width: 18px; display: inline-block; }

    /* Columnas (meses / días) */
    .columnas { display: flex; align-items: flex-end; gap: 6px; height: 170px; padding-top: 18px; border-bottom: 1px solid var(--linea); position: relative; }
    .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; cursor: default; }
    .col .c { width: min(38px, 70%); background: var(--oliva); border-radius: 4px 4px 0 0; min-height: 2px; }
    .col:hover .c { background: #676a53; }
    .col .v { font-size: 11px; font-weight: 700; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
    .ejes { display: flex; gap: 6px; }
    .ejes span { flex: 1; text-align: center; font-size: 11px; color: var(--gris); padding-top: 6px; text-transform: capitalize; }
    .tip { position: fixed; pointer-events: none; background: var(--tinta); color: #fff; font-size: 12.5px; padding: 8px 10px; border-radius: 8px; z-index: 100; opacity: 0; transition: opacity .1s; max-width: 260px; }
    .tip.ver { opacity: 1; }

    .seg { display: inline-flex; background: var(--papel); border-radius: 999px; padding: 3px; box-shadow: inset 0 0 0 1.5px var(--linea); }
    .seg button { border: 0; background: none; padding: 6px 13px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--gris); }
    .seg button.activo { background: var(--tinta); color: #fff; }

    /* Lista de reservas */
    .filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .filtros input[type=search] { max-width: 240px; padding: 8px 12px; border-radius: 999px; border: 1.5px solid var(--linea); }
    .dia-grupo { margin-bottom: 18px; }
    .dia-grupo h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--oliva); margin: 0 0 8px; }
    .res { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; background: var(--papel); border-radius: 12px; padding: 13px 16px; box-shadow: var(--sombra); margin-bottom: 8px; cursor: pointer; border-left: 4px solid var(--linea); }
    .res:hover { box-shadow: 0 0 0 2px var(--amarillo), var(--sombra); }
    .res .h { font-family: var(--f-titulo); font-weight: 800; font-size: 17px; }
    .res .t { font-weight: 700; }
    .res .d { font-size: 13px; color: var(--gris); }
    .res .m { text-align: right; }
    .res .m b { font-family: var(--f-titulo); display: block; }
    .est { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
    .est-pendiente { background: #FBEBC7; color: #7a5410; } .res.e-pendiente { border-left-color: var(--amarillo); }
    .est-confirmada { background: #E3E6D8; color: #4b4e3b; } .res.e-confirmada { border-left-color: var(--oliva); }
    .est-pagada { background: #DCEBD8; color: #35612f; } .res.e-pagada { border-left-color: var(--ok); }
    .est-realizada { background: #ECEAE6; color: #555; } .res.e-realizada { border-left-color: #bdb6aa; }
    .est-cancelada { background: #F6DDD7; color: var(--error); } .res.e-cancelada { border-left-color: var(--error); opacity: .65; }

    /* Calendario del panel */
    .pcal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--linea); border-radius: 12px; overflow: hidden; }
    .pcal .dow { background: var(--crema); padding: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--gris); }
    .pcal .cel { background: var(--papel); min-height: 104px; padding: 6px; font-size: 12px; }
    .pcal .cel.fuera { background: #faf7f1; color: #bbb; }
    .pcal .cel.hoy .n { background: var(--terracota); color: #fff; border-radius: 999px; padding: 1px 7px; }
    .pcal .cel.bloq { background: repeating-linear-gradient(135deg, #fff, #fff 6px, #f3ede2 6px, #f3ede2 12px); }
    .pcal .n { font-weight: 700; display: inline-block; margin-bottom: 4px; }
    .pcal .ev { display: block; width: 100%; text-align: left; border: 0; border-radius: 6px; padding: 4px 6px; margin-bottom: 3px; font-size: 11.5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
    @media (max-width: 700px) { .pcal .cel { min-height: 64px; padding: 3px; } .pcal .ev { font-size: 0; height: 7px; padding: 0; } }

    /* Panel lateral de detalle */
    .velo { position: fixed; inset: 0; background: rgba(31,28,25,.4); z-index: 50; display: flex; justify-content: flex-end; }
    .cajon { width: min(520px, 100%); background: var(--crema); height: 100%; overflow-y: auto; padding: 22px; box-shadow: -10px 0 30px rgba(0,0,0,.15); }
    .cajon .cerrar { float: right; border: 0; background: var(--papel); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 18px; }
    .cajon .bloque { background: var(--papel); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
    .cajon .bloque h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--oliva); margin-bottom: 8px; }
    .linea { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; font-size: 14px; }
    .estados { display: flex; flex-wrap: wrap; gap: 6px; }
    .estados button { border: 1.5px solid var(--linea); background: var(--papel); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .estados button.activo { background: var(--tinta); border-color: var(--tinta); color: #fff; }

    table.tabla { width: 100%; border-collapse: collapse; font-size: 14px; }
    .tabla th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--gris); padding: 8px 10px; border-bottom: 1.5px solid var(--linea); }
    .tabla td { padding: 10px; border-bottom: 1px solid var(--linea); vertical-align: middle; }
    .tabla td.num, .tabla th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .tabla tr:hover td { background: #fcfaf5; }
    .scroll-x { overflow-x: auto; }

    .item-fila { display: grid; grid-template-columns: 1fr 90px 34px; gap: 8px; margin-bottom: 8px; }
    .item-fila button { border: 0; background: var(--crema); border-radius: 8px; cursor: pointer; }
    code.url { display: block; background: var(--tinta); color: var(--amarillo); padding: 12px; border-radius: 10px; font-size: 12.5px; word-break: break-all; margin: 8px 0; }
    ol.pasos-ios li { margin-bottom: 6px; }
  </style>
</head>
<body>
  <div id="banda-demo" class="banda-demo oculto">Modo demo · datos de ejemplo guardados en este navegador · <a href="#" id="reset-demo" style="color:#fff">reiniciar demo</a></div>

  <!-- LOGIN -->
  <section class="login oculto" id="login">
    <form class="tarjeta" id="form-login">
      <img src="img/logo_h_dark.png" alt="arrózame">
      <h2 style="text-align:center;font-size:20px">Panel de reservas</h2>
      <label class="campo"><span>Email</span><input type="email" name="email" autocomplete="username" required></label>
      <label class="campo"><span>Contraseña</span><input type="password" name="password" autocomplete="current-password" required></label>
      <div class="aviso error oculto" id="login-error"></div>
      <button class="btn" style="width:100%">Entrar</button>
      <p class="small muted oculto" id="login-demo" style="text-align:center;margin-bottom:0">Modo demo: cualquier email y contraseña sirven.</p>
    </form>
  </section>

  <!-- APP -->
  <div class="app oculto" id="app">
    <aside class="lateral">
      <img src="img/logo_h_light.png" alt="arrózame">
      <nav id="menu">
        <button data-vista="agenda" class="activo"><span class="ico">📋</span> Agenda</button>
        <button data-vista="calendario"><span class="ico">📅</span> Calendario</button>
        <button data-vista="estadisticas"><span class="ico">📊</span> Ventas</button>
        <button data-vista="clientes"><span class="ico">👥</span> Clientes</button>
        <button data-vista="carta"><span class="ico">🥘</span> Carta</button>
        <button data-vista="ajustes"><span class="ico">⚙️</span> Ajustes</button>
      </nav>
      <div class="pie"><div id="usuario"></div><button id="salir">Cerrar sesión</button></div>
    </aside>
    <div class="sesion-movil"><span id="usuario-movil"></span><button id="salir-movil">Cerrar sesión</button></div>
    <main id="vista"></main>
  </div>

  <div class="tip" id="tip"></div>
  <script type="module" src="js/panel.js"></script>
</body>
</html>
